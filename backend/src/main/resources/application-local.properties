server.port=8080

# Postgres (local via docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtrackerpro
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.pool-name=JobTrackerPro-HikariPool

# Email (MailHog for local via docker) open http://localhost:8025 to view emails
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Gemini AI Integration (Google AI Studio)
# To enable, set app.gemini.enabled=true and provide your GEMINI_API_KEY
app.gemini.enabled=${APP_GEMINI_ENABLED:false}
gemini.api.key=${GEMINI_API_KEY:}
# Standard Google AI Studio Gemini API Endpoint
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}

# Groq AI Integration (Fallback)
groq.api.enabled=${GROQ_API_ENABLED:true}
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}

# OpenRouter AI Integration (Fallback 2)
openrouter.api.enabled=true
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.api.model=${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct}
app.gmail.sync-range=${APP_GMAIL_SYNC_RANGE:30d}

app.storage.type=local

# JWT (Only for dev)
app.jwt.secret=9a999dhthughari45647638763748293048567832901234
app.jwt.expiration-ms=900000
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:012345678901234567890123456789012345678901234567890123456789}
# 30 days
app.jwt.refresh-expiration-ms=2592000000
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Lax

# config
app.allowed.cors=http://localhost:4200
app.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
app.public.endpoints=/api/auth/signup,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/forgot-password,/api/auth/verify-email,/api/auth/resend-verification,/api/auth/reset-password,/oauth2/**,/api/webhooks/inbound-email,/api/webhooks/gmail/push,/api/storage/files/**,/api/cron/**
app.cron.secret=local-cron-secret-123

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# UI url
app.ui.url=http://localhost:4200

# Base url
app.base-url=http://localhost:8080

spring.threads.virtual.enabled=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local Storage (for testing, not for production)
cloudflare.r2.public-url.avatars=http://localhost:8080/api/storage/files
cloudflare.r2.public-url.resources=http://localhost:8080/api/storage/files

# Google OAuth2 open https://console.cloud.google.com/auth/clients/create
# Select Application name as JobTrackerPro Local
# Select Application type as Web Application
# Add Authorized redirect URIs as http://localhost:8080/login/oauth2/code/google
# Get Client ID and Client Secret
# use those values below
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# configure Google Pub/Sub for Gmail push notifications open https://console.cloud.google.com/apis/library/pubsub.googleapis.com
# create a topic named gmail-notifications in the project job-tracker-pro and use the topic name below 
# Set up a subscription for the topic with the push endpoint as https://{NGROK_TUNNEL}/api/webhooks/gmail/push and use the service account 
app.google.pubsub-topic=${GOOGLE_PUBSUB_TOPIC:projects/job-tracker-pro/topics/gmail-notifications}

# Webhook Security
# For local development, you can use ngrok to create a secure tunnel to your localhost. Run ngrok with the command ngrok http 8080 and it will provide you with a public URL (e.g., https://petrolic-jennie-hungrily.ngrok-free.dev) that tunnels to your local server. Use this URL as the webhook audience and in your Google Pub/Sub subscription.
app.security.webhook-audience=https://${NGROK_TUNNEL:localhost:8080}/api/webhooks/gmail/push
# The service account should have the role Pub/Sub Subscriber and Pub/Sub Invoker. You can create a service account in the Google Cloud Console, generate a key for it, and use the email address of the service account below.
app.security.google-pubsub-service-account=${GOOGLE_PUBSUB_SERVICE_ACCOUNT:job-tracker-webhook-invoker@gserviceaccount.com}

# GITHUB OAuth2 open github.com/settings/applications/new
# Set Application Name as JobTrackerPro Local
# Set Homepage URL as http://localhost:4200
# Set Authorization callback URL as http://localhost:8080/login/oauth2/code/github
# Get Client ID and Client Secret
# use those values below
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

# Email Sender Details
email.sender_email=${EMAIL_SENDER:noreply@jobtrackerpro.local}
email.sender_name=${EMAIL_SENDER_NAME:JobTrackerPro Developer}
email.sender_address=${EMAIL_SENDER_ADDRESS:JobTrackerPro <noreply@jobtrackerpro.local>}
