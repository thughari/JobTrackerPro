spring.datasource.url=jdbc:h2:mem:jobtrackerpro_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.gemini.enabled=false
app.storage.type=local

app.allowed.cors=http://localhost:4200
app.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
app.public.endpoints=/api/auth/signup,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/forgot-password,/api/auth/reset-password,/oauth2/**,/api/webhooks/inbound-email,/api/storage/files/**,/api/cron/**
app.cron.secret=test-cron-secret-123

app.jwt.secret=012345678901234567890123456789012345678901234567890123456789
app.jwt.expiration-ms=900000
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:012345678901234567890123456789012345678901234567890123456789}
app.jwt.refresh-expiration-ms=2592000000
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Lax

app.ui.url=http://localhost:4200
app.base-url=http://localhost:8080
app.security.webhook-audience=${app.base-url}/api/webhooks/gmail/push
app.security.google-pubsub-service-account=test-account@job-tracker-pro.iam.gserviceaccount.com

app.google.pubsub-topic=projects/job-tracker-pro/topics/gmail-notifications

spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

email.sender_email=noreply@test.local
email.sender_name=JobTrackerPro Test
email.sender_address=JobTrackerPro Test <noreply@test.local>

cloudflare.r2.public-url.avatars=http://localhost:8080/api/storage/files
cloudflare.r2.public-url.resources=http://localhost:8080/api/storage/files