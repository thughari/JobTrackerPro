<div class="min-h-screen bg-[#0B0E14] font-sans flex flex-col">

  <nav class="sticky top-0 z-50 bg-[#0B0E14]/80 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a routerLink="/" class="cursor-pointer hover:opacity-80 transition-opacity">
          <app-logo size="md"></app-logo>
        </a>
        <div class="flex items-center gap-4">
          <a routerLink="/login" class="text-sm font-medium text-gray-400 hover:text-white transition-colors whitespace-nowrap">Log in</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <div class="bg-[#151A23] border border-gray-800 rounded-2xl p-8 shadow-xl relative overflow-hidden">
        
        <!-- Decoration for high-end feel -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/10 rounded-full blur-3xl"></div>

        @if (!signupSuccess()) {
          <!-- SIGNUP FORM -->
          <div class="animate-fade-in">
            <div class="text-center mb-8">
              <h2 class="text-2xl font-bold text-white mb-2">Create account</h2>
              <p class="text-gray-400 text-sm">Enter your details to get started</p>
            </div>

            @if (errorMessage()) {
              <div class="mb-6 p-3 rounded-lg bg-red-500/10 border border-red-500/20 flex items-center gap-3 animate-slide-in">
                <i class="ph ph-warning-circle text-red-500 text-xl"></i>
                <span class="text-sm text-red-400 font-medium flex-1">{{ errorMessage() }}</span>
                <button (click)="clearMessages()" class="text-red-400 hover:text-white"><i class="ph ph-x"></i></button>
              </div>
            }

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-3 mb-6">
              <button (click)="socialSignUp('google')" class="flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-900 font-medium h-10 rounded-lg transition-all active:scale-95">
                <img src="google-logo.svg" alt="Google" class="w-4 h-4">
                <span class="text-sm">Google</span>
              </button>
              <button (click)="socialSignUp('github')" class="flex items-center justify-center gap-2 bg-[#24292F] hover:bg-[#24292F]/90 text-white font-medium h-10 rounded-lg transition-all active:scale-95">
                <i class="ph ph-github-logo text-lg"></i>
                <span class="text-sm">GitHub</span>
              </button>
            </div>

            <div class="relative mb-6">
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
              <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span class="bg-[#151A23] px-2 text-gray-500">Or continue with email</span></div>
            </div>

            <form (ngSubmit)="onSubmit()" class="space-y-5">
              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5">Name</label>
                <input type="text" [(ngModel)]="signUpUser.name" name="name" class="w-full bg-[#0B0E14] border border-gray-800 rounded-lg px-3 py-2.5 text-white focus:border-indigo-500 focus:outline-none transition-colors" placeholder="John Doe" required>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5">Email</label>
                <input type="email" [(ngModel)]="signUpUser.email" name="email" class="w-full bg-[#0B0E14] border border-gray-800 rounded-lg px-3 py-2.5 text-white focus:border-indigo-500 focus:outline-none transition-colors" placeholder="name@example.com" required>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5">Password</label>
                <div class="relative">
                  <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="signUpUser.password" (input)="onPasswordInput()" name="password" class="w-full bg-[#0B0E14] border border-gray-800 rounded-lg pl-3 pr-10 py-2.5 text-white focus:border-indigo-500 focus:outline-none transition-colors" placeholder="••••••••" required>
                  <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300"><i class="ph text-lg" [ngClass]="showPassword() ? 'ph-eye' : 'ph-eye-slash'"></i></button>
                </div>
                <!-- Strength Meter -->
                <div class="mt-2 flex items-center justify-between gap-2">
                  <div class="flex-1 flex gap-1 h-1">
                    <div class="h-full rounded-full transition-all duration-500 w-full" [ngClass]="passwordStrength() >= 1 ? getStrengthColor() : 'bg-gray-800'"></div>
                    <div class="h-full rounded-full transition-all duration-500 w-full" [ngClass]="passwordStrength() >= 2 ? getStrengthColor() : 'bg-gray-800'"></div>
                    <div class="h-full rounded-full transition-all duration-500 w-full" [ngClass]="passwordStrength() >= 3 ? getStrengthColor() : 'bg-gray-800'"></div>
                    <div class="h-full rounded-full transition-all duration-500 w-full" [ngClass]="passwordStrength() >= 4 ? getStrengthColor() : 'bg-gray-800'"></div>
                  </div>
                </div>
              </div>

              <button type="submit" [disabled]="isLoading()" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold h-12 rounded-xl transition-all mt-2 flex justify-center items-center gap-2 active:scale-95 shadow-lg shadow-indigo-500/20">
                @if (isLoading()) { <i class="ph ph-spinner animate-spin text-lg"></i> } @else { Sign Up }
              </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
              Already have an account? <a routerLink="/login" class="text-indigo-400 hover:underline font-bold">Login now</a>
            </div>
          </div>
        } @else {
          <!-- SUCCESS VIEW: THE VERIFICATION STEP -->
          <div class="pt-4 space-y-6">
    <div class="p-4 bg-indigo-500/5 border border-indigo-500/10 rounded-2xl">
        <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mb-1">Sent to</p>
        <p class="text-white font-mono text-sm truncate">{{ signUpUser.email }}</p>
    </div>

    <div class="space-y-4">
        <button (click)="resendEmail()" 
                [disabled]="isResending() || resendCooldown() > 0"
                class="w-full py-3 px-4 bg-white/5 border border-white/10 hover:bg-white/10 text-white rounded-xl text-sm font-bold transition-all disabled:opacity-50">
            <i class="ph ph-arrows-clockwise" [class.animate-spin]="isResending()"></i>
            {{ resendCooldown() > 0 ? 'Resend in ' + resendCooldown() + 's' : 'Resend Verification Email' }}
        </button>

        <button (click)="signupSuccess.set(false)" class="text-sm font-bold text-gray-500 hover:text-white transition-colors">
            <i class="ph ph-arrow-left"></i> I used the wrong email address
        </button>
    </div>
</div>
        }
      </div>
    </div>
  </div>
</div>
